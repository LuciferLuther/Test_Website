name: Quality details

on:
  workflow_dispatch:
  push:
    branches:
      - agent/japan-slowly-vercel
    paths:
      - .github/workflows/quality-details.yml

permissions:
  contents: read

jobs:
  diagnose:
    name: Test, typecheck, lint, and build separately
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the project
        uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm run test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Lint application source
        run: npm run lint
      - name: Build the production app
        run: npm run build
